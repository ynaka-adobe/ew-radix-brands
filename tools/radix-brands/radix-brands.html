<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radix Brand Themes</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/tools/radix-brands/radix-brands.css">
<script src="https://da.live/nx/utils/sdk.js" type="module"></script>
<script src="/tools/radix-brands/radix-brands.js" type="module"></script>
</head>
<body>
<header>
  <h1>Radix Brand Themes</h1>
  <nav>
    <button data-tab="designer" class="active">Designer</button>
    <button data-tab="parity">Parity</button>
  </nav>
</header>
<main>
  <section id="designer">
    <aside>
      <label>Brand <select id="brand"></select></label>
      <label class="inline"><input type="checkbox" id="compare"> Compare with other brand</label>
      <div id="controls"></div>
      <details><summary>Save to GitHub</summary>
        <label>Repo (owner/name) <input id="repo" placeholder="org/site"></label>
        <label>Personal access token <input id="pat" type="password" placeholder="repo scope"></label>
        <label class="inline"><input type="checkbox" id="direct" checked> Commit directly to the default branch (uncheck for a pull request)</label>
        <button id="save">Apply to repo</button>
        <p id="saveStatus"></p>
      </details>
    </aside>
    <div id="previews"></div>
  </section>
  <section id="parity" hidden>
    <p class="hint">Every block against every brand. A cell is green when the brand defines every token the block uses.</p>
    <div id="matrix"></div>
  </section>
</main>
</body>
</html>
