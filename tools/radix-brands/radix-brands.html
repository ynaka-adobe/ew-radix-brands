<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radix Brand Themes</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/tools/radix-brands/radix-brands.css">
<script src="https://da.live/nx/utils/sdk.js" type="module"></script>
<script src="/tools/radix-brands/radix-brands.js" type="module"></script>
</head>
<body>
<header>
  <h1>Radix Brand Themes</h1>
  <nav>
    <button data-tab="brands" class="active">Brands</button>
    <button data-tab="parity">Parity</button>
  </nav>
  <a id="edit" target="_blank" rel="noopener">Edit in the design system ↗</a>
</header>
<main>
  <section id="brands">
    <aside>
      <p class="hint" id="source">Loading the design system…</p>
      <div id="brandList"></div>
      <label class="inline" id="compareWrap"><input type="checkbox" id="compare"> Compare with other brand</label>
      <p id="status"></p>
      <div id="summary"></div>
    </aside>
    <div id="previews"></div>
  </section>
  <section id="parity" hidden>
    <p class="hint">Every block against every brand. A cell is green when the brand defines everything the block's CSS depends on, and the block uses no hardcoded colors or sizes.</p>
    <div id="matrix"></div>
  </section>
</main>
</body>
</html>
