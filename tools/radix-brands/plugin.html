<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radix Brand Themes</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light dark; }
  body { margin:0; font:13px system-ui,sans-serif; padding:10px; display:flex; flex-direction:column; gap:10px; }
  .brands { display:flex; gap:6px; flex-wrap:wrap; }
  button { padding:7px 10px; border:1px solid #c9ccd1; border-radius:6px; background:Canvas; color:CanvasText; cursor:pointer; font:inherit; }
  .brands button { flex:1; }
  button.active { background:CanvasText; color:Canvas; }
  button.primary { background:#3e63dd; color:#fff; border:0; }
  button:disabled { opacity:.5; cursor:default; }
  label { display:flex; flex-direction:column; gap:3px; color:GrayText; font-size:12px; }
  input, select { font:inherit; padding:5px 7px; border:1px solid #c9ccd1; border-radius:6px; background:Canvas; color:CanvasText; }
  #controls { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  #controls .wide { grid-column:1 / -1; }
  .actions { display:flex; flex-direction:column; gap:6px; }
  #status { margin:0; color:GrayText; font-size:12px; min-height:2.6em; }
  details { border-top:1px solid #e0e1e6; padding-top:8px; }
  summary { cursor:pointer; color:GrayText; }
</style>
<script type="module" src="/tools/radix-brands/plugin.js"></script>
</head>
<body>
  <div class="brands" id="brands"></div>
  <div id="controls"></div>
  <p id="status">Connecting…</p>
  <div class="actions">
    <button id="apply" class="primary" disabled>Apply to repo (update theme)</button>
    <button id="setbrand" disabled>Set as this page's brand</button>
  </div>
  <details>
    <summary>GitHub access</summary>
    <label>Repo (owner/name)<input id="repo"></label>
    <label>Personal access token (Contents: write)<input id="pat" type="password" autocomplete="off"></label>
  </details>
</body>
</html>
